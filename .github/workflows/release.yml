name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build phantom EDF
        run: python samples\build_phantom_edf.py

      - name: Run tests
        run: python -m pytest tests

      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm EDFViewer-windows.spec

      - name: Run packaged CLI smoke test
        shell: pwsh
        run: |
          $arguments = @(
            "--mode", "cli", "samples\phantom.edf",
            "--channel", "sine", "--start", "0", "--length", "5",
            "--cwt-scales", "8", "--export", "csv,parameters",
            "-o", "outputs\release-smoke"
          )
          $process = Start-Process -FilePath ".\dist\EDFViewer\EDFViewer.exe" `
            -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged CLI smoke test failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path "outputs\release-smoke\*_features.csv")) {
            throw "Packaged CLI smoke test did not create a feature CSV."
          }
          if (-not (Test-Path "outputs\release-smoke\*_parameters.json")) {
            throw "Packaged CLI smoke test did not create a parameter JSON file."
          }

      - name: Run packaged GUI startup smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath ".\dist\EDFViewer\EDFViewer.exe" `
            -ArgumentList @("--mode", "gui") -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Packaged GUI exited early with exit code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id
          Wait-Process -Id $process.Id -ErrorAction SilentlyContinue

      - name: Create Windows release archive
        shell: pwsh
        run: |
          Compress-Archive -Path ".\dist\EDFViewer" `
            -DestinationPath "..\EDFViewer-Windows-x64-${{ github.ref_name }}.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: EDFViewer-Windows-x64-${{ github.ref_name }}.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS package
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mac/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest edfio

      - name: Build phantom EDF
        run: python samples/build_phantom_edf.py

      - name: Run tests
        run: python -m pytest tests

      - name: Build macOS application
        run: python -m PyInstaller --clean --noconfirm EDFViewer.spec

      - name: Run packaged CLI smoke test
        run: |
          dist/EDFViewer.app/Contents/MacOS/EDFViewer --mode cli \
            samples/phantom.edf --channel sine --start 0 --length 5 \
            --cwt-scales 8 --export csv,parameters \
            -o outputs/release-smoke
          test -n "$(find outputs/release-smoke -name '*_features.csv' -print -quit)"
          test -n "$(find outputs/release-smoke -name '*_parameters.json' -print -quit)"

      - name: Run packaged GUI startup smoke test
        run: |
          QT_QPA_PLATFORM=offscreen \
            dist/EDFViewer.app/Contents/MacOS/EDFViewer --mode gui &
          app_pid=$!
          sleep 5
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || true

      - name: Create macOS release archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/EDFViewer.app \
            ../EDFViewer-macOS-${{ github.ref_name }}.zip

      - name: Upload macOS release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: EDFViewer-macOS-${{ github.ref_name }}.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        run: |
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            release-assets/*.zip \
            release-assets/SHA256SUMS.txt \
            --verify-tag \
            --title "EDFViewer $TAG_NAME" \
            --generate-notes
